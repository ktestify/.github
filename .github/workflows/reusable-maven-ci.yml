name: Reusable Maven CI

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version to build with"
        type: string
        default: "25"
      run-integration-tests:
        description: "Whether to run integration tests (requires Docker)"
        type: boolean
        default: false
      maven-opts:
        description: "Additional Maven options"
        type: string
        default: ""

jobs:
  build:
    name: Build & Test (Java ${{ inputs.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "temurin"
          cache: "maven"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & verify (no ITs)
        if: ${{ !inputs.run-integration-tests }}
        run: mvn verify -B -ntp ${{ inputs.maven-opts }}

      - name: Build & verify (with ITs)
        if: ${{ inputs.run-integration-tests }}
        run: mvn verify -B -ntp -Pintegration-tests ${{ inputs.maven-opts }}

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-java${{ inputs.java-version }}
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java${{ inputs.java-version }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
