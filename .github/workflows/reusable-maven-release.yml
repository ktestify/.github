# ============================================================
# Reusable Maven Release — publish to Maven Central
#
# SEMVER-SAFE: you select a bump type, the workflow calculates
# everything from the current pom.xml version.
#
# Bump types:
#   major             → 0.1.3-SNAPSHOT  →  1.0.0  →  1.0.1-SNAPSHOT
#   minor             → 0.1.3-SNAPSHOT  →  0.2.0  →  0.2.1-SNAPSHOT
#   bugfix            → 0.1.3-SNAPSHOT  →  0.1.3  →  0.1.4-SNAPSHOT
#   release-candidate → 0.1.3-SNAPSHOT  →  0.1.3-rc.1  →  0.1.3-SNAPSHOT (unchanged)
#                       (auto-increments rc.N from existing git tags)
#
# Required secrets (set as org or repo secrets):
#   KTESTIFY_CHANGELOG_PAT — PAT with repo scope for git push & tagging
#   CENTRAL_USERNAME       — Maven Central Portal username token
#   CENTRAL_PASSWORD       — Maven Central Portal password token
#   GPG_PRIVATE_KEY        — ASCII-armored GPG private key
#   GPG_PASSPHRASE         — Passphrase for the GPG key
# ============================================================
name: Reusable Maven Release

on:
  workflow_call:
    inputs:
      bump-type:
        description: "Version bump type"
        type: string
        required: true
      dry-run:
        description: "Dry run — build & sign but skip publish, tag & GitHub Release"
        type: boolean
        default: false
      release-name-prefix:
        description: "Prefix for the GitHub Release name (e.g. 'ktestify-core')"
        type: string
        default: ""
      push-container:
        description: "Whether to push a Docker image via JIB to GHCR"
        type: boolean
        default: false
      container-image:
        description: "Container image name for JIB (e.g. ghcr.io/ktestify/ktestify-cucumber)"
        type: string
        default: ""
      release-artifacts:
        description: "Newline-separated globs for GitHub Release artifacts"
        type: string
        default: ""
      update-readme-badge:
        description: "Whether to update shields.io version badge in README.md"
        type: boolean
        default: true
    secrets:
      KTESTIFY_CHANGELOG_PAT:
        required: true
      CENTRAL_USERNAME:
        required: true
      CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

env:
  JAVA_VERSION: "25"
  MAVEN_OPTS: "-Xmx2048m -XX:+EnableDynamicAgentLoading"

jobs:
  release:
    name: 🚀 Release (${{ inputs.bump-type }})
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: read

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout (full history for tagging)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.KTESTIFY_CHANGELOG_PAT }}
          fetch-depth: 0

      # ── Java & Maven ──────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # ── Semver calculation ────────────────────────────────
      # Reads current POM version, calculates release version
      # and next SNAPSHOT based on the selected bump type.
      - name: Calculate versions from bump type
        id: semver
        run: |
          set -euo pipefail

          BUMP_TYPE="${{ inputs.bump-type }}"

          # Validate bump type
          case "${BUMP_TYPE}" in
            major|minor|bugfix|release-candidate) ;;
            *)
              echo "::error::Invalid bump type '${BUMP_TYPE}'. Must be: major, minor, bugfix, release-candidate"
              exit 1
              ;;
          esac

          # Read current POM version
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -ntp)
          echo "Current POM version: ${CURRENT_VERSION}"

          # Must end with -SNAPSHOT
          if [[ ! "${CURRENT_VERSION}" =~ -SNAPSHOT$ ]]; then
            echo "::error::POM version '${CURRENT_VERSION}' must end with -SNAPSHOT"
            exit 1
          fi

          # Strip -SNAPSHOT, then strip any -rc.N to get clean MAJOR.MINOR.PATCH
          BASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          CLEAN_VERSION="${BASE_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_VERSION}"

          echo "Parsed: MAJOR=${MAJOR} MINOR=${MINOR} PATCH=${PATCH}"

          case "${BUMP_TYPE}" in
            major)
              RELEASE_VERSION="$((MAJOR + 1)).0.0"
              NEXT_SNAPSHOT="$((MAJOR + 1)).0.1-SNAPSHOT"
              ;;
            minor)
              RELEASE_VERSION="${MAJOR}.$((MINOR + 1)).0"
              NEXT_SNAPSHOT="${MAJOR}.$((MINOR + 1)).1-SNAPSHOT"
              ;;
            bugfix)
              RELEASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              NEXT_SNAPSHOT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
              ;;
            release-candidate)
              # Find highest existing RC tag for this version
              LATEST_RC=$(git tag -l "v${MAJOR}.${MINOR}.${PATCH}-rc.*" | sort -V | tail -1 || true)
              if [ -z "${LATEST_RC}" ]; then
                RC_NUM=1
              else
                RC_NUM=$(echo "${LATEST_RC}" | sed 's/.*-rc\.//')
                RC_NUM=$((RC_NUM + 1))
              fi
              RELEASE_VERSION="${MAJOR}.${MINOR}.${PATCH}-rc.${RC_NUM}"
              NEXT_SNAPSHOT="${CURRENT_VERSION}"  # Stay on same SNAPSHOT for RCs
              ;;
          esac

          echo "Release version : ${RELEASE_VERSION}"
          echo "Next SNAPSHOT   : ${NEXT_SNAPSHOT}"

          # Validate release version is valid semver
          if ! echo "${RELEASE_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::Calculated release version '${RELEASE_VERSION}' is not valid semver"
            exit 1
          fi

          echo "release-version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "next-snapshot=${NEXT_SNAPSHOT}" >> "${GITHUB_OUTPUT}"
          echo "current-version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"

          echo "✅ ${CURRENT_VERSION} --[${BUMP_TYPE}]--> ${RELEASE_VERSION} --> ${NEXT_SNAPSHOT}"

      # ── GPG ───────────────────────────────────────────────
      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | \
            gpg --batch --import --no-tty
          KEY_FPR=$(gpg --list-secret-keys --with-colons 2>/dev/null \
                   | awk -F: '/^fpr/{print $10; exit}')
          echo "${KEY_FPR}:6:" | gpg --import-ownertrust --batch --no-tty
          echo "Imported key fingerprint: ${KEY_FPR}"

      # ── Set release version ───────────────────────────────
      - name: Set pom.xml to release version
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.semver.outputs.release-version }} \
            --no-transfer-progress
          mvn versions:commit --no-transfer-progress

      # ── Update README badge ───────────────────────────────
      - name: Update README.md version badge
        if: ${{ inputs.update-readme-badge }}
        run: |
          RELEASE_VERSION="${{ steps.semver.outputs.release-version }}"
          # shields.io version badge
          sed -i -E \
            "s|(badge/version-)([^?]+)(-6EE7B7)|\1${RELEASE_VERSION}\3|" \
            README.md
          # Maven <version> tag in dependency snippet
          sed -i -E \
            "s|(<version>)[0-9][^<]*(</version>)|\1${RELEASE_VERSION}\2|" \
            README.md
          echo "README.md updated → ${RELEASE_VERSION}"

      # ── Build, test & sign ────────────────────────────────
      - name: Build with release profile (compile + test + GPG sign)
        run: |
          mvn verify -P release \
            --no-transfer-progress \
            -Dspotless.check.skip=true
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # ── Publish to Maven Central ──────────────────────────
      - name: Publish to Maven Central
        if: ${{ !inputs.dry-run }}
        run: |
          mvn deploy -P release \
            --no-transfer-progress \
            -DskipTests \
            -Dspotless.check.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # ── Push container image (JIB) ────────────────────────
      - name: Publish Docker image to GHCR
        if: ${{ !inputs.dry-run && inputs.push-container }}
        run: |
          mvn jib:build \
            --no-transfer-progress \
            -Dspotless.check.skip=true \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Docker image summary
        if: ${{ !inputs.dry-run && inputs.push-container }}
        run: |
          {
            echo "### 🐳 Docker image published"
            echo ""
            echo "| Tag | Image |"
            echo "|:----|:------|"
            echo "| ${{ steps.semver.outputs.release-version }} | ${{ inputs.container-image }}:${{ steps.semver.outputs.release-version }} |"
            echo "| latest | ${{ inputs.container-image }}:latest |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ── Commit, tag & push ────────────────────────────────
      - name: Commit release version, tag & push
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if [ -f README.md ] && ${{ inputs.update-readme-badge }}; then
            git add README.md
          fi
          git commit -m "chore(release): prepare release ${{ steps.semver.outputs.release-version }} [skip ci]"
          git tag -a "v${{ steps.semver.outputs.release-version }}" \
            -m "Release ${{ steps.semver.outputs.release-version }}"
          git push origin main --follow-tags

      # ── Generate release notes (git-cliff) ────────────────
      - name: Generate release notes (git-cliff)
        if: ${{ !inputs.dry-run }}
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.KTESTIFY_CHANGELOG_PAT }}

      # ── Update CHANGELOG.md ───────────────────────────────
      - name: Update CHANGELOG.md (git-cliff full history)
        if: ${{ !inputs.dry-run }}
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.KTESTIFY_CHANGELOG_PAT }}

      # ── Bump to next SNAPSHOT ─────────────────────────────
      - name: Bump to next SNAPSHOT
        if: ${{ !inputs.dry-run }}
        run: |
          NEXT_SNAPSHOT="${{ steps.semver.outputs.next-snapshot }}"
          mvn versions:set \
            -DnewVersion="${NEXT_SNAPSHOT}" \
            --no-transfer-progress
          mvn versions:commit --no-transfer-progress

          if [ -f README.md ] && ${{ inputs.update-readme-badge }}; then
            NEXT_SNAPSHOT_BADGE=$(echo "${NEXT_SNAPSHOT}" | sed 's/-/--/g')
            sed -i -E \
              "s|(badge/version-)([^?]+)(-6EE7B7)|\1${NEXT_SNAPSHOT_BADGE}\3|" \
              README.md
            sed -i -E \
              "s|(<version>)[0-9][^<]*(</version>)|\1${NEXT_SNAPSHOT}\2|" \
              README.md
          fi

          git add pom.xml CHANGELOG.md
          if [ -f README.md ] && ${{ inputs.update-readme-badge }}; then
            git add README.md
          fi
          git commit -m "chore(release): prepare next iteration ${NEXT_SNAPSHOT} [skip ci]"
          git push origin main

      # ── GitHub Release ────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.KTESTIFY_CHANGELOG_PAT }}
          tag_name: v${{ steps.semver.outputs.release-version }}
          name: "${{ inputs.release-name-prefix }} ${{ steps.semver.outputs.release-version }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ inputs.bump-type == 'release-candidate' }}
          files: ${{ inputs.release-artifacts }}

      # ── Rollback on failure ───────────────────────────────
      - name: Rollback on failure
        if: ${{ failure() && !inputs.dry-run }}
        run: |
          echo "A release step failed — attempting rollback..."
          TAG="v${{ steps.semver.outputs.release-version }}"

          if git ls-remote --tags origin "${TAG}" | grep -q "${TAG}"; then
            git push origin --delete "${TAG}" \
              && echo "Deleted remote tag ${TAG}" \
              || echo "Warning: could not delete remote tag ${TAG} — delete it manually."
          fi

          git tag -d "${TAG}" 2>/dev/null && echo "Deleted local tag ${TAG}" || true
          git checkout HEAD -- pom.xml CHANGELOG.md README.md 2>/dev/null || true

          echo ""
          echo "Rollback complete."
          echo "Review the failure above, fix the root cause, then re-trigger the workflow."

      # ── Dry-run summary ───────────────────────────────────
      - name: Generate dry-run changelog preview
        if: ${{ inputs.dry-run }}
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --unreleased --bump
        env:
          OUTPUT: RELEASE_NOTES_DRYRUN.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.KTESTIFY_CHANGELOG_PAT }}

      - name: Dry-run summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "✅ Dry-run complete — artifacts were built & signed."
          echo "   Bump type       : ${{ inputs.bump-type }}"
          echo "   Current version : ${{ steps.semver.outputs.current-version }}"
          echo "   Release version : ${{ steps.semver.outputs.release-version }}"
          echo "   Next SNAPSHOT   : ${{ steps.semver.outputs.next-snapshot }}"
          echo "   Nothing was published, tagged, or pushed."
          echo ""
          echo "📋 Release notes preview:"
          cat RELEASE_NOTES_DRYRUN.md

